<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block pdf_title %}KAIROS{% endblock %}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 11pt;
            color: #1f2937;
            line-height: 1.5;
        }

        .header {
            border-bottom: 2px solid #2563eb;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2563eb;
            margin: 0;
            font-size: 24pt;
        }

        .header .subtitle {
            color: #6b7280;
            font-size: 10pt;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h2 {
            color: #2563eb;
            font-size: 14pt;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .field-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 5px;
        }

        .field .label {
            font-weight: bold;
            color: #4b5563;
            font-size: 9pt;
        }

        .field .value {
            color: #1f2937;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9pt;
            font-weight: bold;
        }

        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-progress { background: #dbeafe; color: #1e40af; }
        .badge-completed { background: #d1fae5; color: #065f46; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 6px 10px;
            text-align: left;
            font-size: 10pt;
        }

        th {
            background: #f3f4f6;
            font-weight: bold;
            color: #374151;
        }

        .footer {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            font-size: 8pt;
            color: #9ca3af;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>KAIROS</h1>
        <div class="subtitle">Plataforma de Gestión de Procesos de Gestoría</div>
    </div>

    {% block content %}{% endblock %}

    <div class="footer">
        Generado el {{ generated_at|date:"d/m/Y H:i" }} — KAIROS
    </div>
</body>
</html>
