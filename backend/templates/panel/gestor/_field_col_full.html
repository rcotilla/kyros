{# Renders a single form field at full width — Bootstrap 5 floating label #}
<div class="col-12">
    <div class="form-floating mb-2">
        {{ f }}
        <label for="{{ f.id_for_label }}">
            {{ f.label }}
            {% if f.field.required %}<span class="text-danger">*</span>{% endif %}
        </label>
    </div>
    {% if f.errors %}
    <div class="text-danger small">
        {% for error in f.errors %}{{ error }}{% endfor %}
    </div>
    {% endif %}
</div>
